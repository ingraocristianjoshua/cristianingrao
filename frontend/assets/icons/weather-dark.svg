<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#FF9F0A" />
    </linearGradient>

    <!-- Cloud Gradient (Dark mode soft greyish blue) -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#98a3b5" />
      <stop offset="100%" stop-color="#6a7587" />
    </linearGradient>
    
    <!-- Cloud Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base dark background (Apple's dark mode weather actually has a deep blue-grey tint, but black works for tinted style) -->
  <rect width="100" height="100" rx="22.5" fill="#151b26"/>

  <!-- Sun -->
  <circle cx="65" cy="40" r="22" fill="url(#sunGrad)"/>

  <!-- Cloud -->
  <path d="M 33 74 
           A 15 15 0 0 1 33 44 
           A 22 22 0 0 1 72 45 
           A 16 16 0 0 1 73 74 
           Z" 
        fill="url(#cloudGrad)" 
        filter="url(#shadow)"/>
</svg>
