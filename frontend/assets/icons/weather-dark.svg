<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sfumatura per il sole -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdf2e" />
      <stop offset="100%" stop-color="#f1a104" />
    </linearGradient>

    <!-- Sfumatura per la nuvola -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e2e2" />
      <stop offset="100%" stop-color="#7a7a7a" />
    </linearGradient>
    
    <!-- Ombra della nuvola sul sole (simulata con un filtro o semplicemente la sfumatura stessa dà l'idea) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sfondo squircle macOS -->
  <rect width="100" height="100" rx="22.5" fill="#1c1c1e"/>

  <!-- Sole -->
  <circle cx="65" cy="40" r="22" fill="url(#sunGrad)"/>

  <!-- Nuvola con ombra -->
  <path d="M 33 72 
           A 14 14 0 0 1 33 44 
           A 22 22 0 0 1 72 45 
           A 16 16 0 0 1 73 72 
           Z" 
        fill="url(#cloudGrad)" 
        filter="url(#shadow)"/>
</svg>
