<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Sfondo squircle macOS -->
  <rect width="100" height="100" rx="22.5" fill="#1c1c1e"/>
  
  <!-- Tacchette -->
  <!-- Ore 12 --> <line x1="50" y1="5" x2="50" y2="15" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Ore 1 -->  <line x1="72.5" y1="11" x2="67.5" y2="19" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ore 2 -->  <line x1="89" y1="27.5" x2="81" y2="32.5" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ore 3 -->  <line x1="95" y1="50" x2="85" y2="50" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Ore 4 -->  <line x1="89" y1="72.5" x2="81" y2="67.5" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ore 5 -->  <line x1="72.5" y1="89" x2="67.5" y2="81" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ore 6 -->  <line x1="50" y1="95" x2="50" y2="85" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Ore 7 -->  <line x1="27.5" y1="89" x2="32.5" y2="81" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ore 8 -->  <line x1="11" y1="72.5" x2="19" y2="67.5" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ore 9 -->  <line x1="5" y1="50" x2="15" y2="50" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Ore 10 --> <line x1="11" y1="27.5" x2="19" y2="32.5" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ore 11 --> <line x1="27.5" y1="11" x2="32.5" y2="19" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Numeri principali -->
  <text x="50" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">12</text>
  <text x="50" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">6</text>
  <text x="28" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">9</text>
  <text x="72" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">3</text>

  <!-- Lancetta delle ore (corta, grossa) -->
  <line x1="50" y1="50" x2="65" y2="42" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Lancetta dei minuti (lunga, media) -->
  <line x1="50" y1="50" x2="78" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Centro -->
  <circle cx="50" cy="50" r="3" fill="#1c1c1e" stroke="#fff" stroke-width="2"/>
