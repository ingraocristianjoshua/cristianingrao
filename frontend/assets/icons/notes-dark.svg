<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Liquid Glass body (semi-transparent) -->
  <rect width="100" height="100" rx="22.5" fill="rgba(40, 40, 40, 0.4)" stroke="url(#glassGrad)" stroke-width="2"/>
  
  <!-- Dark mode yellow header with slight transparency -->
  <path d="M0 22.5 C0 10 10 0 22.5 0 L77.5 0 C90 0 100 10 100 22.5 L100 28 L0 28 Z" fill="rgba(214, 168, 72, 0.85)"/>
  
  <!-- Binding holes (cutout look) -->
  <circle cx="15" cy="14" r="2" fill="rgba(20,20,20,0.6)"/>
  <circle cx="29" cy="14" r="2" fill="rgba(20,20,20,0.6)"/>
  <circle cx="43" cy="14" r="2" fill="rgba(20,20,20,0.6)"/>
  <circle cx="57" cy="14" r="2" fill="rgba(20,20,20,0.6)"/>
  <circle cx="71" cy="14" r="2" fill="rgba(20,20,20,0.6)"/>
  <circle cx="85" cy="14" r="2" fill="rgba(20,20,20,0.6)"/>
  
  <!-- Lines (subtle white for glass contrast) -->
  <line x1="15" y1="48" x2="85" y2="48" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="68" x2="85" y2="68" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="88" x2="60" y2="88" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
