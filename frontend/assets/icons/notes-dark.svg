<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Paper gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    
    <!-- Yellow header gradient (slightly muted for dark mode) -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6a848"/>
      <stop offset="100%" stop-color="#c49b1a"/>
    </linearGradient>

    <!-- Drop shadow for the tear line -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base App Squircle (Shadows are handled by CSS on desktop) -->
  <rect width="100" height="100" rx="22.5" fill="url(#paperGrad)" />
  
  <!-- Faint horizontal ruled lines (Dark mode) -->
  <line x1="0" y1="45" x2="100" y2="45" stroke="#3a3a3c" stroke-width="1.5"/>
  <line x1="0" y1="60" x2="100" y2="60" stroke="#3a3a3c" stroke-width="1.5"/>
  <line x1="0" y1="75" x2="100" y2="75" stroke="#3a3a3c" stroke-width="1.5"/>
  <line x1="0" y1="90" x2="100" y2="90" stroke="#3a3a3c" stroke-width="1.5"/>
  
  <!-- Yellow binding top -->
  <path d="M0 22.5 C0 10 10 0 22.5 0 L77.5 0 C90 0 100 10 100 22.5 L100 28 L0 28 Z" fill="url(#yellowGrad)"/>
  
  <!-- Torn paper edge effect (subtle straight line with shadow) -->
  <rect x="0" y="27" width="100" height="2" fill="#a88516" opacity="0.8"/>
  <path d="M0 29 L100 29 L100 30 L0 30 Z" fill="#2c2c2e" filter="url(#dropShadow)" opacity="0.9"/>

  <!-- Binding stitching/texture -->
  <circle cx="20" cy="14" r="2.5" fill="#8a6d12"/>
  <circle cx="35" cy="14" r="2.5" fill="#8a6d12"/>
  <circle cx="50" cy="14" r="2.5" fill="#8a6d12"/>
  <circle cx="65" cy="14" r="2.5" fill="#8a6d12"/>
  <circle cx="80" cy="14" r="2.5" fill="#8a6d12"/>

  <!-- Inner border to simulate 3D edge -->
  <rect width="100" height="100" rx="22.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" pointer-events="none" />
  <rect width="100" height="100" rx="22.5" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.3" pointer-events="none" />
</svg>
