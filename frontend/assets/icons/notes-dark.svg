<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Base foglio (nero per contrasto o leggermente grigio se vogliamo che si distingua, usiamo #2a2a2c o #333) -->
  <rect width="90" height="90" x="5" y="5" rx="15" fill="#2a2a2c"/>
  
  <!-- Header giallo con bordino sotto -->
  <path d="M5 20 C5 11.7 11.7 5 20 5 L80 5 C88.3 5 95 11.7 95 20 L95 28 L5 28 Z" fill="#ffcc00"/>
  
  <!-- Buchi neri in alto -->
  <circle cx="15" cy="22" r="1.5" fill="#1c1c1e"/><circle cx="25" cy="22" r="1.5" fill="#1c1c1e"/>
  <circle cx="35" cy="22" r="1.5" fill="#1c1c1e"/><circle cx="45" cy="22" r="1.5" fill="#1c1c1e"/>
  <circle cx="55" cy="22" r="1.5" fill="#1c1c1e"/><circle cx="65" cy="22" r="1.5" fill="#1c1c1e"/>
  <circle cx="75" cy="22" r="1.5" fill="#1c1c1e"/><circle cx="85" cy="22" r="1.5" fill="#1c1c1e"/>
  
  <!-- Righe della nota -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="70" x2="80" y2="70" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>
</svg>
